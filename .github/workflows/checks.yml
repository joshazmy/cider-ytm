name: Checks

# Keep branch-protection-visible signals independent. The native Linux lane installs the real
# WebKitGTK/libmpv stack and drives the compiled Tauri application; it is intentionally not a
# browser surrogate.

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same PR makes the earlier run irrelevant.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Rustfmt and diff hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # `components: rustfmt` rather than the default toolchain: nothing here compiles, so the rest
      # would only be download time.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt

      # --all covers every workspace member, --check reports and exits non-zero instead of editing.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: git diff --check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA" --

      - name: How to fix
        if: failure()
        run: |
          echo "::notice::Run 'cargo fmt --all' locally and commit the result."
          echo "::notice::Run 'git diff --check origin/master HEAD --' locally to find whitespace errors."
          echo "rustfmt.toml at the repo root matches the existing style, so this should only"
          echo "touch code you actually changed. If it wants to reformat files you never opened,"
          echo "please open an issue instead of committing the churn."

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # pnpm must exist before setup-node configures the pnpm-store cache.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Unit checks
        run: pnpm --dir ui test:unit

      - name: Svelte check
        run: pnpm --dir ui check

      - name: Frontend build
        run: pnpm --dir ui build

  rust-tests:
    name: Pure Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: Pure Rust tests
        run: cargo test -p innertube -p player -p listen-protocol

  native-e2e:
    name: Native desktop E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libmpv-dev \
            webkit2gtk-driver \
            xvfb \
            xauth \
            dbus-daemon \
            sqlite3 \
            util-linux \
            curl

      # pnpm must exist before setup-node configures the pnpm-store cache.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install pinned native E2E tools
        run: |
          npm install --global @tauri-apps/cli@2.11.4
          cargo install tauri-driver \
            --version 2.0.6 \
            --locked \
            --root "$RUNNER_TEMP/tauri-driver"

      - name: Native desktop E2E
        env:
          YAPEL_E2E_TAURI_DRIVER: ${{ runner.temp }}/tauri-driver/bin/tauri-driver
          YAPEL_E2E_WEBKIT_DRIVER: /usr/bin/WebKitWebDriver
        run: |
          ./scripts/run-desktop-e2e.sh \
            --build \
            --artifacts artifacts/desktop-e2e

      - name: Upload native E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/desktop-e2e/
          if-no-files-found: error
          retention-days: 14
